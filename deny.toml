# cargo-deny configuration.
#
# This replaces the unmodified upstream template, which had never been run and
# could not have passed: it allowed only MIT and Unicode-DFS-2016, with
# Apache-2.0 left commented out, so it would have failed on `ring` (Apache-2.0
# AND ISC) and `unicode-ident` (Unicode-3.0) the first time anybody tried. A
# 300-line template documenting every option is worth less than a short file
# somebody has actually read — an unreviewed config that cannot pass is the same
# problem as no config, with the added cost of looking like one.
#
# **Needs cargo-deny 0.17 or newer.** 0.16.1 fails on this workspace with
# "unknown variant `2024`", because eleven crates in the graph are edition 2024
# and that version's manifest parser predates it. CI pins a new enough one.

[graph]
# Both platforms this is developed and deployed on. Without a target list,
# cargo-deny checks every target's dependencies, which pulls in crates neither
# build ever compiles.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

[licenses]
# Every licence actually reachable in the graph, and nothing else. Derived by
# reading `cargo metadata`, not by guessing:
#
#   MIT           the bulk of it, and what satisfies every `MIT OR ...` crate
#   Apache-2.0    `mintex` alone requires it, and `ring` needs it *and* ISC
#   ISC           `ring` (Apache-2.0 AND ISC) and `untrusted`
#   Unicode-3.0   `unicode-ident` ((MIT OR Apache-2.0) AND Unicode-3.0)
#   BSD-3-Clause  `subtle`, under `rustls`, which offers nothing else
#
# `AND` is why Apache-2.0 and ISC are not optional: an `OR` expression is
# satisfied by any one branch, an `AND` by all of them. `BSD-2-Clause` and
# `Zlib` are reachable too — `zerocopy`, `lru-slab`, `tinyvec` — and are *not*
# listed, because each is an `OR` branch MIT already satisfies. Listing a
# licence nothing requires is how this file stops describing the graph.
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "Unicode-3.0",
    "BSD-3-Clause",
]
confidence-threshold = 0.8

[bans]
# One version of a crate, or say why there are two. The OpenTelemetry stack
# carried *two* copies of `opentelemetry` (0.23 and 0.24, via
# `tracing-opentelemetry`) for an exporter that never initialised, and nothing
# was watching. This is what would have said so.
#
# Kept at `deny` with a named exception rather than relaxed to `warn`: the case
# that mattered was a *runtime* duplicate, and a warning nobody reads would have
# missed it just as thoroughly as no check at all.
multiple-versions = "deny"
skip = [
    # Build-time only, and not ours to fix: `clap_derive`, `tokio-macros` and
    # `tracing-attributes` are on syn 2 while `serde_derive` and `thiserror-impl`
    # have moved to syn 3. None ends up in the binary — proc-macro crates are
    # compiled for the host and discarded — so this costs compile time and
    # nothing else. Revisit when clap moves.
    #
    # `num-derive` used to be named here as the second syn-2 user. It left the
    # graph with `TODO.md` #13a, which replaced the `OpCode` sentinel it was
    # deriving `FromPrimitive` for; the duplicate outlived it because the list
    # was never only those two.
    { crate = "syn", reason = "proc-macro build dependency; clap_derive is on 2, serde_derive on 3" },

    # These two *do* ship in the binary, which is the case the paragraph above
    # says this check exists for, so each names what would collapse it rather
    # than only that it is transitive (`TODO.md` #91):
    #
    #   getrandom    `ring` 0.17 pins 0.2; our `rand` 0.10 is on 0.4. It
    #                collapses when `ring` moves, which is not ours to do.
    #   cpufeatures  our `sha1`/`sha2` 0.10 are on 0.2; `chacha20`, under
    #                `rand` 0.10, is on 0.3. It collapses when we move to
    #                RustCrypto 0.11 — which is ours to do, and is #91's
    #                remainder.
    #
    # Both are small: a getrandom shim and a CPU-feature probe. Re-check when
    # either parent moves; a skip nobody revisits is the thing this file was
    # written to stop.
    { crate = "getrandom", reason = "ring 0.17 pins 0.2, rand 0.10 needs 0.4" },
    { crate = "cpufeatures", reason = "sha1/sha2 0.10 are on 0.2, chacha20 on 0.3" },

    # `rustc-hash` is neither of the two cases above: `dhat` 0.3.3 pins 1, and
    # `quinn`/`quinn-proto` are on 2. A default `rdnsd` build has one copy —
    # `cargo tree -p rdnsd -i rustc-hash` shows 2.1.3 alone — because `dhat` is
    # behind the off-by-default `dhat-heap` feature and is otherwise a dev
    # dependency. It duplicates only in a profiling or test build, which is why
    # it took `--all-features` to see it at all. 0.3.3 is the latest `dhat`, so
    # it collapses when `dhat` moves, which is not ours to do.
    { crate = "rustc-hash", reason = "dhat 0.3.3 pins 1, quinn is on 2; dhat-heap and tests only" },
]

wildcards = "deny"
# `rdns = { path = "../rdns" }` has no version to pin, and pinning one inside a
# workspace would mean bumping four manifests to change one number. The lint is
# aimed at `foo = "*"` from a registry, which is a different thing.
allow-wildcard-paths = true

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
