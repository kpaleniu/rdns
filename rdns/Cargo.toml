[package]
name = "rdns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "DNS library: wire codec, zone files, caching, resolver and DNSSEC. Shared by rdnsc, rdnsd and rdnsr."

[dependencies]
thiserror = "2.0"
rand = "0.8"
num-traits = "0.2"
num-derive = "0.4"

# DNSSEC crypto
ring = "0.17"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"

tokio.workspace = true
tracing.workspace = true
# The subscriber is here, but nothing in this crate installs one: `logging::init`
# exists so that `rdnsd` and `rdnsr` configure logging identically rather than
# each growing their own copy to drift (`CLAUDE.md` §7). A binary calls it, once.
tracing-subscriber.workspace = true

[dev-dependencies]
# Benchmarks that measure optimized code, in `benches/`. A dev-dependency, so
# nothing it brings in is in a shipped binary — `cargo tree -e normal` is
# unchanged by it — and 22 packages is what a statistics-driven harness with
# baseline comparison costs (`TODO.md` #9e). Default features off: `plotters`
# and `rayon` are for HTML reports nobody here reads, and `cargo_bench_support`
# is the one that makes `cargo bench` work.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# Allocation counting for `tests/allocations.rs`. A dev-dependency, so a normal
# build of the library never sees it.
dhat = "0.3"

[[bench]]
name = "answer_path"
harness = false
