[package]
name = "rdns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "DNS above the wire: zone files, DNSSEC, transfers, the resolver and a daemon's operational furniture. The codec is rdns-core."

[dependencies]
rdns-core.workspace = true
rdns-present.workspace = true
rdns-tsig.workspace = true
thiserror = "2.0"
# `HashTable` for the zone's name index (`TODO.md` #71d): a table whose entries
# need not own their key, which is the raw API std keeps behind the unstable
# `hash_raw_entry`. Already in `Cargo.lock` through indexmap <- toml and already
# linked into both daemons, so the lock gains an edge and no package — 218
# either side. `default-features = false` drops the default hasher, which
# nothing here uses: every probe passes its own hash.
hashbrown = { version = "0.17", default-features = false }
rand = "0.8"

# DNSSEC crypto
ring = "0.17"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"

tokio.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
# The SAN check for `security::TransferCertificates` (`TODO.md` #59), which is
# the same code rustls used to verify the chain — already in the lock under
# `rustls`, so naming it costs no package and saves a second X.509 parser.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std", "ring"] }
tokio-rustls.workspace = true
# Emitting only. No `tracing-subscriber`: installing one is a decision about the
# process, so it lives in `rdns-transport` with the two daemons (`TODO.md` #85).
tracing.workspace = true

[dev-dependencies]
# Benchmarks that measure optimized code, in `benches/`. A dev-dependency, so
# nothing it brings in is in a shipped binary — `cargo tree -e normal` is
# unchanged by it — and 22 packages is what a statistics-driven harness with
# baseline comparison costs (`TODO.md` #9e). Default features off: `plotters`
# and `rayon` are for HTML reports nobody here reads, and `cargo_bench_support`
# is the one that makes `cargo bench` work.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# Allocation counting for `tests/allocations.rs`. A dev-dependency, so a normal
# build of the library never sees it.
dhat = "0.3"
# A certificate per run for the XFR-over-TLS tests (`TODO.md` #44d), the same
# dev-dependency and the same flags `rdns-transport` uses for DoT's — so it is
# one version in the lock rather than two, and still zero runtime packages.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

[[bench]]
name = "answer_path"
harness = false
