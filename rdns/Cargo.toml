[package]
name = "rdns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "DNS library: wire codec, zone files, caching, resolver and DNSSEC. Shared by rdnsc, rdnsd and rdnsr."

[dependencies]
thiserror = "2.0"
rand = "0.8"
num-traits = "0.2"
num-derive = "0.4"

# DNSSEC crypto
ring = "0.17"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"

tokio.workspace = true
tracing.workspace = true
# The subscriber is here, but nothing in this crate installs one: `logging::init`
# exists so that `rdnsd` and `rdnsr` configure logging identically rather than
# each growing their own copy to drift (`CLAUDE.md` §7). A binary calls it, once.
tracing-subscriber.workspace = true

[dev-dependencies]
# Allocation counting for `tests/allocations.rs`. A dev-dependency, so a normal
# build of the library never sees it.
dhat = "0.3"
