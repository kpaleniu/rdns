[package]
name = "rdnsc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Basic DNS query command line tool. Supports bare essentials and not stuff like DNS over TLS."
license.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
rdns-core.workspace = true
# The presentation format, so a transfer prints a zone file rather than
# `{:?}` (`TODO.md` #66b). One package and 46 KB; depending on `rdns` for the
# same function measured at 38 packages and 385 KB (#67).
rdns-present.workspace = true

[dev-dependencies]
# For the one thing a client cannot check on its own: that what it prints is
# what this tree's zone parser reads back (`TODO.md` #66b). No cycle — nothing
# in `rdns` depends on a binary.
rdns.workspace = true
