[package]
name = "rdnsc"
version = "0.1.0"
edition = "2021"
description = "Basic DNS query command line tool. Supports bare essentials and not stuff like DNS over TLS."
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rdns = { path = "../rdns" }