[package]
name = "rdnsd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Authoritative DNS server. Serves zone files over UDP and TCP from one process, with AXFR, TSIG and NOTIFY."
license.workspace = true

[dependencies]
clap.workspace = true
rdns.workspace = true
tokio.workspace = true
anyhow.workspace = true
signal-hook = { version = "0.3", optional = true }
# Heap profiling, off unless asked for: `cargo run --release --features dhat-heap`.
dhat = { version = "0.3", optional = true }
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"], optional = true }
toml = "1.1.4"
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }

[features]
# Swap in DHAT's allocator shim and write `dhat-heap.json` on exit. Never on by
# default: it records a backtrace per allocation, so a build with it is useless
# for timing and only meaningful for counts and sizes.
dhat-heap = ["dep:dhat"]
