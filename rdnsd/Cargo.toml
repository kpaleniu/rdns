[package]
name = "rdnsd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Authoritative DNS server. Serves zone files over UDP and TCP from one process, with AXFR, TSIG and NOTIFY."
license.workspace = true

[dependencies]
clap.workspace = true
rdns.workspace = true
rdns-transport.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
# Heap profiling, off unless asked for: `cargo run --release --features dhat-heap`.
dhat = { version = "0.3", optional = true }
toml = "1.1.4"
serde = { version = "1.0.229", features = ["derive"] }
# SIGHUP uses `tokio::signal::unix`, which `tokio`'s "full" already provides —
# `signal-hook` and `signal-hook-tokio` were here for that and are gone. They
# also never worked: the call needed a `StreamExt` nothing imported, so `rdnsd`
# did not compile on Unix.

[dev-dependencies]
# Two tests build a subscriber to assert what each log level emits; nothing in
# the binary does (`TODO.md` #30n).
tracing-subscriber.workspace = true

[features]
# Swap in DHAT's allocator shim and write `dhat-heap.json` on exit. Never on by
# default: it records a backtrace per allocation, so a build with it is useless
# for timing and only meaningful for counts and sizes.
dhat-heap = ["dep:dhat"]
