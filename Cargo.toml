[workspace]
members = [
    "rdns",
    "rdns-core",
    "rdns-transport",
    "rdnsc",
    "rdnsctl",
    "rdnsd",
    "rdnsr"
]
resolver = "2"

# One place for the version and for the internal dependency. Three binaries each
# spelling `rdns = { path = "../rdns" }` is three manifests to edit for one
# number — and with no `version` alongside the path, none of them could ever be
# published, which is what `cargo deny check bans` says when it rejects a
# wildcard dependency on a publishable crate.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
# Pinned so a build that would fail on the toolchain the README promises fails in
# CI rather than at a user. Verified by the `msrv` job, not asserted.
rust-version = "1.95"

[workspace.dependencies]
rdns = { path = "rdns", version = "0.1.0" }
rdns-core = { path = "rdns-core", version = "0.1.0" }
rdns-transport = { path = "rdns-transport", version = "0.1.0" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
# Not `full`: its `parking_lot` feature costs five packages — `parking_lot`,
# `parking_lot_core`, `lock_api`, `scopeguard`, `smallvec` — for a mutex nothing
# here asks for, and `fs`, `process` and `io-std` compile code with no caller
# (there is no `tokio::fs` or `tokio::process` in the tree). These seven are what
# the code names; `tokio::task` and `tokio::spawn` come with `rt-multi-thread`.
tokio = { version = "1.41.1", features = [
    "time",
    "sync",
    "net",
    "io-util",
    "signal",
    "macros",
    "rt-multi-thread",
] }
# Levels, so a malformed-packet flood is not 50k journald lines a second and so
# the message is not built at all when nothing wants it. The library only emits;
# the binaries choose where it goes.
tracing = "0.1"
# TLS for DoT (#42a). `ring`, not rustls's default `aws-lc-rs` provider: ring
# resolves to 0.17.14, the exact version this tree already links for DNSSEC and
# TSIG, so the provider is a feature flag rather than a second crypto library —
# and no cmake or C toolchain comes with it. Measured: +6 runtime packages.
#
# `logging` is off, which is the seventh package. rustls logs through the `log`
# facade, and `tracing-subscriber` here has `tracing-log` disabled on purpose
# ("nothing here logs through the log facade"), so those records would be built
# and dropped. A dependency whose output nothing reads is §14's liability; turn
# the feature and the bridge on together or neither.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# `default-features = false` drops `ansi` (output goes to a journal, not a
# terminal) and `tracing-log` (nothing here logs through the `log` facade).
# `env-filter` is kept for `RUST_LOG`, which is how a level gets changed on a
# server that is already misbehaving.
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "env-filter",
] }

# DHAT's frame table has no file:line without this, which makes a heap profile a
# list of addresses. Costs build time and binary size, not run-time speed.
[profile.release]
debug = 1
