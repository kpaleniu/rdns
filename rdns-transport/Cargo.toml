[package]
name = "rdns-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The socket layer both rdns daemons run: admission, framing, accept loops and the shutdown epilogue. Not a DNS implementation — that is rdns."

[dependencies]
rdns.workspace = true
tokio.workspace = true
tracing.workspace = true
# The reason this crate exists rather than a module in `rdns`: the pieces below
# report to a human reading a log line, and `CLAUDE.md` §3 says the library
# returns typed errors and only a binary may use `anyhow`. A crate whose only
# consumers are the two daemons may (`TODO.md` #30c, #30d, #31).
anyhow.workspace = true
# `logging::init`, on the same argument: installing a subscriber is a decision
# about the process, which a library may not make for its caller (`TODO.md`
# #85). One copy, not one per binary, so the two cannot drift apart.
tracing-subscriber.workspace = true
# DoT (#42a). Here rather than in `rdns` because a TLS stack belongs at the
# socket layer: the zone parser and the signer have no business linking one.
# RFC 8484 $4.1's GET form is base64url. Already in the tree (`rdns` decodes
# TSIG secrets and DNSSEC keys with it), so this costs no package.
base64 = "0.22"
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
quinn.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true

[dev-dependencies]
# Test-only, so the runtime package count is untouched: the DoT tests need a
# certificate, and one generated per run beats a key checked into the tree.
# `ring` rather than the default provider, for the reason the workspace
# manifest gives about rustls.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
