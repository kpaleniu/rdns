[package]
name = "rdnsr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Recursive DNS resolver with caching, and a forwarding mode. Separate from the authoritative server (rdnsd)."
license.workspace = true

[dependencies]
clap.workspace = true
rdns.workspace = true
rdns-transport.workspace = true
# For `quinn::Endpoint::server`, bound beside the other listeners (#42b).
quinn.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
# The config file (`TODO.md` #63). Nine packages, every one of which `rdnsd`
# already pays for, so the workspace lock is unchanged.
toml = "1.1.4"
serde = { version = "1.0.229", features = ["derive"] }
# No `tracing-subscriber`: `rdns_transport::logging::init` installs the
# subscriber and this binary never names the crate (`TODO.md` #30n, #85).
