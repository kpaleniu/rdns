// BIND 9.20 as a secondary of rdnsd (43a). The three things being tested are in
// the zone clauses: a primary on a non-default port, TSIG on the transfer, and
// whether the refresh after a NOTIFY is an IXFR delta or a silent fall back to
// AXFR (RFC 1995 §2 permits the fallback, which is why it has to be read out of
// the log rather than inferred from the result).
options {
    directory "/var/cache/bind";
    listen-on port 53 { any; };
    listen-on-v6 { none; };
    recursion no;
    // No root anchor reaches this network and none is wanted: what BIND holds
    // here is a copy of somebody else's signed zone, not a validated one.
    dnssec-validation no;
    // A secondary here notifies nobody; the only NOTIFY on this network comes
    // from the primary under test.
    notify no;
    querylog yes;
    // 10.53.0.10 is the probe container. 43a compares the replica against the
    // original record for record, which means pulling it back out.
    allow-transfer { 10.53.0.10; };
};

logging {
    channel stderr_log {
        stderr;
        severity debug 3;
        print-category yes;
        print-severity yes;
        print-time yes;
    };
    category default { stderr_log; };
    category xfer-in { stderr_log; };
    category notify { stderr_log; };
};

key "interop.key." {
    algorithm hmac-sha256;
    secret "DIgmHeQfYvAHq1dJuoah8wGGbWNisBT3457iG6YMdhE=";
};

zone "example.com" {
    type secondary;
    primaries { 10.53.0.2 port 5353 key "interop.key."; };
    file "example.com.db";
    allow-notify { 10.53.0.2; };
};

zone "example.net" {
    type secondary;
    primaries { 10.53.0.2 port 5353 key "interop.key."; };
    file "example.net.db";
    allow-notify { 10.53.0.2; };
};

zone "example.org" {
    type secondary;
    primaries { 10.53.0.2 port 5353 key "interop.key."; };
    file "example.org.db";
    allow-notify { 10.53.0.2; };
};
