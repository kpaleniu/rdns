# Knot 3.6 as a secondary of rdnsd (43a).
server:
    listen: 0.0.0.0@53
    rundir: /storage/run

database:
    storage: /storage/db

log:
  - target: stderr
    any: debug

key:
  - id: interop.key.
    algorithm: hmac-sha256
    secret: DIgmHeQfYvAHq1dJuoah8wGGbWNisBT3457iG6YMdhE=

remote:
  - id: rdnsd
    address: 10.53.0.2@5353
    key: interop.key.

acl:
  # By key, not by address: an unsigned NOTIFY is denied here, which is what
  # #46 had to fix on the sending side.
  - id: notify_from_rdnsd
    key: interop.key.
    action: notify

  # The probe container, so 43a can pull the replica back and compare it record
  # for record against what rdnsd served.
  - id: probe_xfr
    address: 10.53.0.10
    action: transfer

template:
  - id: default
    storage: /storage/zones
    master: rdnsd
    acl: [notify_from_rdnsd, probe_xfr]
    # A secondary stores what it was given; signing it would be signing somebody
    # else's zone with a key their parent has never heard of.
    dnssec-signing: off

zone:
  - domain: example.com.
  - domain: example.net.
  - domain: example.org.
