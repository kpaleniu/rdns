# rdnsd replicating from BIND and from Knot (43b).
[server]
host = "0.0.0.0"
port = 5353
zone-dir = "/etc/rdns/zones"
query-rate = 0
metrics-listen = "0.0.0.0:9153"
# 43g: the anchors every XoT master's certificate is checked against
# (RFC 9103 §7.5). Written per run by run.sh's setup, which is also what signs
# BIND's; a checked-in certificate would expire on somebody's Tuesday.
transfer-tls-ca = "/srv/run/xot-ca.pem"

[keys."interop.key."]
algorithm = "hmac-sha256"
secret = "DIgmHeQfYvAHq1dJuoah8wGGbWNisBT3457iG6YMdhE="

[zones."frombind.test."]
masters = ["10.53.0.7#interop.key."]

[zones."fromknot.test."]
masters = ["10.53.0.8#interop.key."]

# 43e: the zone whose AXFR arrives in several messages.
[zones."big.test."]
masters = ["10.53.0.7#interop.key."]

# 43f: a catalog, not a zone to serve for its own sake. The zones it lists are
# replicated from the same master with the same key, and `member.test.` appears
# nowhere else in this file on purpose — the catalog is what puts it here.
[zones."catalog.invalid."]
masters = ["10.53.0.7#interop.key."]
catalog = true

# 43g: XFR over TLS. The port is RFC 9103 §7.3's and the `+tls=` name is what
# BIND's certificate has to carry — there is no spelling of "encrypt but do not
# check", because §7.5 makes authenticating the master a MUST. BIND will not
# transfer this zone in clear, so holding it is the assertion.
[zones."fromxot.test."]
masters = ["10.53.0.7:853#interop.key.+tls=xot.example.test"]
