// BIND 9.20 as a primary rdnsd replicates from (43b). Dynamic update is how the
// zone changes: it makes BIND write a journal, which is what makes the refresh
// after the NOTIFY an IXFR rather than an AXFR.
options {
    directory "/var/cache/bind";
    listen-on port 53 { any; };
    listen-on-v6 { none; };
    recursion no;
    dnssec-validation no;
    notify explicit;
    also-notify { 10.53.0.9 port 5353; };
    querylog yes;
};

logging {
    channel stderr_log {
        stderr;
        severity debug 3;
        print-category yes;
        print-severity yes;
        print-time yes;
    };
    category default { stderr_log; };
    category xfer-out { stderr_log; };
    category notify { stderr_log; };
    category update { stderr_log; };
};

key "interop.key." {
    algorithm hmac-sha256;
    secret "DIgmHeQfYvAHq1dJuoah8wGGbWNisBT3457iG6YMdhE=";
};

zone "frombind.test" {
    type primary;
    file "frombind.test.db";
    allow-transfer { key "interop.key."; };
    allow-update { key "interop.key."; };
    notify explicit;
    also-notify { 10.53.0.9 port 5353; };
};

// 43e: five thousand records, so the AXFR out of here is split across several
// messages. RFC 8945 sec 5.3.1 signs the first envelope, the last, and every
// hundredth in between; a receiver that only checks the first would pass every
// test in 43b, where the whole zone fits in one message.
zone "big.test" {
    type primary;
    file "big.test.db";
    allow-transfer { key "interop.key."; };
    notify explicit;
    also-notify { 10.53.0.9 port 5353; };
};
