# Unbound 1.23 as the validating resolver of 43c.
#
# This is the check dnspython structurally cannot make. dnspython verifies an
# RRset against a key; a validator asks whether the *set* of records in an
# answer proves what the answer claims — which is the question every denial
# shape in `rdnsd/src/response_size.rs` is an answer to.
server:
    interface: 0.0.0.0
    port: 53
    access-control: 10.53.0.0/24 allow
    do-ip6: no
    username: ""
    chroot: ""
    directory: "/etc/unbound"
    pidfile: "/var/lib/unbound/unbound.pid"
    logfile: ""
    use-syslog: no
    verbosity: 3
    val-log-level: 2

    # There is no root on this network and no root anchor in this image. Each
    # stub below carries its own anchor, which is the entry point a validator
    # needs; everything else is simply insecure.
    trust-anchor-file: "/etc/unbound/anchors.key"
    harden-dnssec-stripped: yes
    val-permissive-mode: no

    # Both off on purpose. Aggressive NSEC answers a later denial out of an
    # earlier one's range, and a cache hit is not an answer from the server
    # under test — either would quietly turn twelve probes into three.
    aggressive-nsec: no
    prefetch: no
    cache-max-ttl: 1
    cache-max-negative-ttl: 1
    msg-cache-size: 0
    rrset-cache-size: 0

    # The rebinding filter is on by default and 10.0.0.0/8 is on its list, so
    # the glue for the two child nameservers (10.53.0.11) is stripped and the
    # referral dies as SERVFAIL. This was written the other way round first --
    # "the servers are on 10.53.0.0/24 and the zone data is 192.0.2.x, so the
    # filter has nothing to catch" -- which was true until 43c needed a child a
    # validator could reach, and then the glue *was* private answer data.
    # A stripped answer and a bad signature both arrive as SERVFAIL, so getting
    # this wrong reads as a finding against the server under test.
    private-domain: "example.com."
    private-domain: "example.net."

stub-zone:
    name: "example.com."
    stub-addr: 10.53.0.2@5353
    stub-prime: no

stub-zone:
    name: "example.net."
    stub-addr: 10.53.0.2@5353
    stub-prime: no

stub-zone:
    name: "example.org."
    stub-addr: 10.53.0.2@5353
    stub-prime: no
