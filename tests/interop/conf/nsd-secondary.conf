# NSD 4.12 as a secondary of rdnsd (43a).
#
# NOKEY on allow-notify, and it is a finding rather than a convenience: rdnsd
# cannot sign a NOTIFY (rdns/src/notify.rs mentions TSIG nowhere, and
# --also-notify takes an address and nothing else). So
# `allow-notify: 10.53.0.2 interop.key.` -- the form an operator writes once the
# transfer is keyed -- refuses every one of them, and rdnsd records the refusal
# as "acknowledged" and stops retrying. Knot behaves the same way when its
# notify ACL names a key; BIND does not, because it accepts NOTIFY from its
# configured primaries whatever allow-notify says. See TODO.md #46.

server:
    server-count: 1
    ip-address: 0.0.0.0
    port: 53
    zonesdir: "/var/db/nsd"
    verbosity: 3
    # No privilege drop: the zone and xfrd state live on a tmpfs the container
    # owns, and one user is one less thing between a failed transfer and its
    # reason.
    username: ""
    pidfile: "/var/db/nsd/nsd.pid"
    xfrdfile: "/var/db/nsd/xfrd.state"
    zonelistfile: "/var/db/nsd/zone.list"
    database: ""

key:
    name: "interop.key."
    algorithm: hmac-sha256
    secret: "DIgmHeQfYvAHq1dJuoah8wGGbWNisBT3457iG6YMdhE="

zone:
    name: "example.com"
    zonefile: "example.com.zone"
    allow-notify: 10.53.0.2 NOKEY
    request-xfr: 10.53.0.2@5353 interop.key.
    provide-xfr: 10.53.0.10 NOKEY

zone:
    name: "example.net"
    zonefile: "example.net.zone"
    allow-notify: 10.53.0.2 NOKEY
    request-xfr: 10.53.0.2@5353 interop.key.
    provide-xfr: 10.53.0.10 NOKEY

zone:
    name: "example.org"
    zonefile: "example.org.zone"
    allow-notify: 10.53.0.2 NOKEY
    request-xfr: 10.53.0.2@5353 interop.key.
    provide-xfr: 10.53.0.10 NOKEY
