# NSD 4.12 as a secondary of rdnsd (43a).
#
# allow-notify names the key, which is the form an operator writes once the
# transfer is keyed -- and which refused every NOTIFY rdnsd sent until #46,
# because rdnsd could not sign one. 43e asserts that it now can.
#
# Knot's notify ACL below names the key for the same reason. BIND's does not,
# and cannot usefully: it accepts a NOTIFY from anything in the zone's
# primaries list whatever allow-notify says.

server:
    server-count: 1
    ip-address: 0.0.0.0
    port: 53
    zonesdir: "/var/db/nsd"
    verbosity: 3
    # No privilege drop: the zone and xfrd state live on a tmpfs the container
    # owns, and one user is one less thing between a failed transfer and its
    # reason.
    username: ""
    pidfile: "/var/db/nsd/nsd.pid"
    xfrdfile: "/var/db/nsd/xfrd.state"
    zonelistfile: "/var/db/nsd/zone.list"
    database: ""

key:
    name: "interop.key."
    algorithm: hmac-sha256
    secret: "DIgmHeQfYvAHq1dJuoah8wGGbWNisBT3457iG6YMdhE="

zone:
    name: "example.com"
    zonefile: "example.com.zone"
    allow-notify: 10.53.0.2 interop.key.
    request-xfr: 10.53.0.2@5353 interop.key.
    provide-xfr: 10.53.0.10 NOKEY

zone:
    name: "example.net"
    zonefile: "example.net.zone"
    allow-notify: 10.53.0.2 interop.key.
    request-xfr: 10.53.0.2@5353 interop.key.
    provide-xfr: 10.53.0.10 NOKEY

zone:
    name: "example.org"
    zonefile: "example.org.zone"
    allow-notify: 10.53.0.2 interop.key.
    request-xfr: 10.53.0.2@5353 interop.key.
    provide-xfr: 10.53.0.10 NOKEY
