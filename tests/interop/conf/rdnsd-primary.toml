# rdnsd as the primary every peer pulls from (43a), signs for (43c) and is
# updated over (43d).
#
# A config file rather than flags because --config and any other setting are
# mutually exclusive by design, and because a TSIG secret in argv is visible in
# `ps`. The secret below is a throwaway for an internal network with no route
# off this machine; it is in the tree so a rerun measures the same thing.

[server]
host = "0.0.0.0"
# 5353: this image runs as uid 65532 and an unprivileged process cannot bind 53.
# Every peer is told the port explicitly, which is itself worth testing — a
# primary on a non-default port is the shape a container deployment has.
port = 5353
zone-dir = "/etc/rdns/zones"
allow-transfer = ["10.53.0.0/24"]
# Signed: NSD's and Knot's notify ACLs below name the key, so an unsigned
# NOTIFY is refused by both (#46a). BIND is here without one on purpose -- it
# accepts an unsigned NOTIFY from a configured primary regardless, so leaving
# it unkeyed keeps that path covered too.
also-notify = ["10.53.0.3", "10.53.0.4#interop.key."]
# Off, not raised: the limiter drops in silence, and three secondaries starting
# at once against one primary is exactly the burst it would eat.
query-rate = 0
metrics-listen = "0.0.0.0:9153"

# DNS over TLS (#42a), on the port RFC 7858 §3.1 assigns. The certificate is
# self-signed and generated by run.sh into a volume, so the key is never a file
# in this tree and never one on a DrvFs mount, where `ensure_private` would
# refuse it for being mode 0777.
tls-listen = "0.0.0.0:853"
# DoQ (#42b) on the same number: DoT is TCP and this is UDP, so they do not
# collide, and it is the same certificate from the same store.
quic-listen = "0.0.0.0:853"
# DoH (#42c) on 443, which is the point of it: RFC 8484 wants the traffic to
# look like other HTTPS traffic rather than to have a port of its own.
https-listen = "0.0.0.0:443"
tls-cert = "/etc/rdns/tls/cert.pem"
tls-key = "/etc/rdns/tls/key.pem"

[signing]
key-dir = "/etc/rdns/keys"
validity-days = 30

[keys."interop.key."]
algorithm = "hmac-sha256"
secret = "DIgmHeQfYvAHq1dJuoah8wGGbWNisBT3457iG6YMdhE="
zones = ["*"]
# Narrow on purpose: example.org. is the unsigned zone, and an UPDATE that could
# rewrite the signed ones would make 43d's result depend on the signer.
update-zones = ["example.org."]

# NSEC3 and P-384 for this one, so 43c asks every denial shape twice over. The
# algorithm comes from the key file, which run.sh generates with
# --key-algorithm ECDSAP384SHA384.
[zones."example.net."]
nsec3 = true

# #46c: this list is *added* to [server].also-notify, for this zone only. NSD
# is named nowhere else, so "did NSD get a NOTIFY for example.org. and for no
# other zone" is the assertion -- and until #46c the whole table was parsed and
# dropped on the floor.
[zones."example.org."]
also-notify = ["10.53.0.5#interop.key."]
