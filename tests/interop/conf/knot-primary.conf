# Knot 3.6 as a primary rdnsd replicates from (43b).
server:
    listen: 0.0.0.0@53
    rundir: /storage/run

database:
    storage: /storage/db

log:
  - target: stderr
    any: debug

key:
  - id: interop.key.
    algorithm: hmac-sha256
    secret: DIgmHeQfYvAHq1dJuoah8wGGbWNisBT3457iG6YMdhE=

remote:
  - id: rdnsd-secondary
    address: 10.53.0.9@5353
    key: interop.key.

acl:
  - id: rdnsd_xfr
    key: interop.key.
    action: transfer

  - id: rdnsd_update
    key: interop.key.
    action: update

zone:
  - domain: fromknot.test.
    storage: /storage/zones
    file: fromknot.test.zone
    acl: [rdnsd_xfr, rdnsd_update]
    notify: rdnsd-secondary
    zonefile-sync: -1
    journal-content: changes
